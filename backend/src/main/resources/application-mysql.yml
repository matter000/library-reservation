# MySQL profile：启动时加 --spring.profiles.active=mysql
# 使用前请按本机环境修改连接信息，并先手工建库：CREATE DATABASE library_seat DEFAULT CHARSET utf8mb4;
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_seat?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    locations: classpath:db/migration/mysql
  h2:
    console:
      enabled: false
