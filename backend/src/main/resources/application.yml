spring:
  application:
    name: library-seat
  profiles:
    active: h2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  # ★ V2 起建表权移交 Flyway：spring.sql.init 不再执行 schema 脚本，
  #   否则会与 Flyway 双跑建表（V1 的 sql/schema-*.sql 已迁至 db/migration/<db>/V1__baseline.sql）
  sql:
    init:
      mode: never
      continue-on-error: false
  flyway:
    enabled: true
    # locations 必须由具体 profile 指定（h2 / mysql 各一份方言脚本）；
    # 不能留默认值 classpath:db/migration —— Flyway 递归扫描会同时命中两套同名脚本。
    baseline-on-migrate: true          # V1 遗留库（已有表、无 flyway 历史表）→ 打基线后继续
    baseline-version: 1
    baseline-description: V1 schema baseline
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    locale: zh_CN
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      add-mappings: true
  mvc:
    # 无匹配 Handler 时抛 NoHandlerFoundException，由 GlobalExceptionHandler 统一转成 4040（而非 5000）
    throw-exception-if-no-handler-found: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: library-seat-reservation-demo-secret-please-change-in-production
    expire-hours: 24

logging:
  level:
    root: INFO
    com.libseat: INFO
    org.hibernate.SQL: WARN
