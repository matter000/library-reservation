spring:
  application:
    name: library-seat
  profiles:
    active: h2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  sql:
    init:
      mode: always
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai
    locale: zh_CN
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      add-mappings: true
  mvc:
    # 无匹配 Handler 时抛 NoHandlerFoundException，由 GlobalExceptionHandler 统一转成 4040（而非 5000）
    throw-exception-if-no-handler-found: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: library-seat-reservation-demo-secret-please-change-in-production
    expire-hours: 24

logging:
  level:
    root: INFO
    com.libseat: INFO
    org.hibernate.SQL: WARN
