spring:
  datasource:
    url: jdbc:h2:mem:qa_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    clean-disabled: true

server:
  port: 0

app:
  jwt:
    secret: library-seat-reservation-demo-secret-please-change-in-production
    expire-hours: 24

logging:
  level:
    root: WARN
    com.libseat: INFO
